<meta charset="utf-8">
  <!-- THE TAB ICON. The mark itself, cropped to the archer — on the full
       square the figure takes up half the frame and what survives at sixteen
       pixels is a green dot. Same colours as the logo: a black-and-white or
       recoloured variant would be a second mark, and a project has one.
       .ico carries 16, 32 and 48 so the browser picks a size instead of
       squeezing one down to all of them. -->
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>PONSLOOT · contract</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">

<!-- ONE PAGE, ONE FIELD, ONE BUTTON.
     ==================================================================
     There is already a launch console at /launch.html with six sections:
     readiness, token address, season, granting a ticket, payments, the hunt
     gate. Every one of them is used at most once, and on launch day the only
     thing that matters is the contract address. Six sections mean reading six
     headings to find one field, in a hurry, on the day mistakes are expensive.

     So this page does one thing. Paste the address, press Save, and the panel
     below says — from the same endpoints the game itself reads, not from what
     this page just sent — whether the site now sees it.

     WHY THE STATUS PANEL EXISTS AT ALL. "Saved" is not the same as "working".
     The address goes into app_settings, but slots only open if the chain
     answers a balanceOf call, and the payout pool only fills if the token
     actually trades. Reporting "saved" and stopping would have hidden every
     one of those, and the person who pasted it would be left guessing at
     numbers that stay at zero. Each line here names its own reason.

     The admin token lives in a field and in memory. It is never stored, never
     put in the URL, never logged. Reload and it is gone. -->
<style>
  :root {
    --ink: #080b0a; --surf: #0f1613; --line: rgba(234,245,238,.14);
    --lime: #b7f24a; --ivory: #eaf5ee; --muted: rgba(234,245,238,.5);
    --gold: #ffd24a; --bad: #ff8a6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 28px 18px 64px; background: var(--ink); color: var(--ivory);
    font: 15px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 19px; letter-spacing: .14em; text-transform: uppercase; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 26px; font-size: 13px; }
  .card {
    border: 1px solid var(--line); border-radius: 8px; background: var(--surf);
    padding: 18px; margin: 0 0 16px;
  }
  label { display: block; margin: 0 0 14px; }
  label span { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; letter-spacing: .06em; text-transform: uppercase; }
  input {
    width: 100%; padding: 11px 12px; font: inherit; color: var(--ivory);
    background: #0a100d; border: 1px solid var(--line); border-radius: 5px;
  }
  input:focus { outline: none; border-color: var(--lime); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  button {
    font: inherit; padding: 11px 18px; border-radius: 5px; cursor: pointer;
    color: var(--ink); background: var(--lime); border: 1px solid var(--lime);
  }
  button.ghost { background: transparent; color: var(--muted); border-color: var(--line); }
  .ghost-link {
    font: inherit; padding: 11px 18px; border-radius: 5px; text-decoration: none;
    color: var(--lime); background: transparent; border: 1px solid rgba(183,242,74,.4);
  }
  .ghost-link:hover { background: rgba(183,242,74,.1); }
  button:disabled { opacity: .45; cursor: default; }
  .out { margin: 12px 0 0; font-size: 13px; min-height: 20px; }
  .out.bad { color: var(--bad); }
  .out.good { color: var(--lime); }

  dl { margin: 0; display: grid; grid-template-columns: 1fr auto; gap: 9px 14px; align-items: baseline; }
  dt { color: var(--muted); font-size: 13px; }
  dd { margin: 0; text-align: right; }
  dd b { color: var(--gold); font-weight: normal; }
  dd .no { color: var(--muted); }
  dd .yes { color: var(--lime); }
  .addr { font-size: 12px; word-break: break-all; text-align: left; grid-column: 1 / -1; color: rgba(234,245,238,.72); }
  .note { font-size: 12px; color: var(--muted); margin: 12px 0 0; }
</style>

<div class="wrap">
  <h1>Contract</h1>
  <p class="sub">Paste it, save it, and the site shows it. Nothing else on this page.</p>

  <div class="card">
    <label><span>Admin token</span>
      <input id="token" type="password" autocomplete="off" spellcheck="false"
             placeholder="Railway → Variables → ADMIN_TOKEN"></label>
    <label><span>Token contract address</span>
      <input id="addr" spellcheck="false" autocomplete="off"
             placeholder="0x… 40 hex characters, from the launchpad"></label>
    <div class="row">
      <button id="save" type="button">Save</button>
      <button id="clear" class="ghost" type="button">Clear it</button>
    </div>
    <p class="out" id="out"></p>
  </div>

  <div class="card">
    <dl id="status">
      <dt>Loading…</dt><dd></dd>
    </dl>
    <p class="note" id="hint"></p>
    <div class="row" style="margin-top:14px">
      <button class="ghost" id="refresh" type="button">Check again</button>
    </div>
    <!-- NO WALLET BUTTON HERE, and that was a wrong turn worth recording.
         The wallet in Account & Settings is a PLAYER'S wallet — the one a
         faucet and any distribution would pay to. It has nothing to do with
         setting the project's contract, and putting a link to it on this page
         suggested that pasting an address required linking something first.
         Two different wallets, one word. -->
  </div>
</div>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var out = $("out");

  function say(text, kind) {
    out.textContent = text;
    out.className = "out" + (kind ? " " + kind : "");
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  /* WHY THE STATUS IS READ FROM THE PUBLIC ENDPOINTS.
     Asking the admin route what it just stored would only prove that the write
     happened. These are the exact endpoints the game itself calls, so what this
     panel shows is what a player sees — which is the question being asked. */
  function refresh() {
    var rows = [];
    var hint = "";
    return fetch("/api/v1/token", { credentials: "same-origin" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (t) {
        if (!t) {
          rows.push(["The site can read the address", '<span class="no">no — the server did not answer</span>']);
          hint = "The API is not responding. Everything below depends on it.";
          return null;
        }
        rows.push(["The site can read the address",
          t.launched ? '<span class="yes">yes</span>' : '<span class="no">no address set</span>']);
        if (t.address) rows.push(["__addr", esc(t.address)]);
        /* WHICH OF THE TWO SOURCES is in effect. There is a deploy-time Railway
           variable and a row this page writes, and for a long while the variable
           silently won — pasting an address did nothing while the page said
           "Saved". The precedence is fixed, but naming the source is what makes
           that visible instead of taken on faith. */
        if (t.source === "environment") {
          rows.push(["Where it comes from", '<span class="no">the Railway variable</span>']);
          hint = "This address is the TOKEN_ADDRESS variable set on the service, not something typed here. Saving below overrides it; clearing brings it back.";
        } else if (t.source === "console") {
          rows.push(["Where it comes from", '<span class="yes">typed here</span>']);
          hint = t.hasEnvironmentFallback
            ? "Clearing this removes what was typed, and the TOKEN_ADDRESS variable set on the service takes over — the field will not end up empty."
            : "Clearing this leaves no address at all: the chip disappears from the header and the pool goes back to saying the token has not launched.";
        }
        rows.push(["Chain", "<b>" + esc(t.chainId) + "</b>"]);
        if (!t.launched) hint = "Until an address is saved, the header chip stays hidden and the payout pool says the token has not launched.";
        /* THE FEE, SHOWN WITH ITS WORKINGS. A dollar figure on its own is
           something to take on faith; the volume it came from and the pair it
           was read on are what make it checkable against the same public index
           anyone else can open. That is the whole reason the pool can show a
           number at all before our own token exists — paste someone else's
           contract and the pipe proves itself. */
        return fetch("/api/v1/buildings/me", { credentials: "include" })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (b) {
            var f = b && b.fee;
            if (!f) return null;
            var why = {
              token_not_launched: "no address saved yet",
              read_failed: "the index did not answer",
              no_pairs: "this address has no trading pairs",
              rate_unknown: "the fee rate could not be read"
            };
            if (f.reason) {
              rows.push(["Trading fee", '<span class="no">' + esc(why[f.reason] || f.reason) + "</span>"]);
            } else {
              rows.push(["Trading fee", "<b>$" + esc(f.usdPerDay.toLocaleString("en-US", { maximumFractionDigits: 2 })) + "</b> / day"]);
              rows.push(["24h volume it came from",
                "$" + esc(Math.round(f.volume24hUsd).toLocaleString("en-US")) + " · " + esc(f.rateBps / 100) + "%"]);
              if (f.pair) rows.push(["__addr", "pair " + esc(f.pair) + (f.dex ? " on " + esc(f.dex) : "")]);
            }
            return b;
          })
          .catch(function () { return null; })
          .then(function () { return fetch("/api/v1/holdings/me", { credentials: "include" }); })
          .then(function (r) { return r.ok ? r.json() : null; })
          .catch(function () { return null; });
      })
      .then(function (h) {
        if (!h) return;
        /* Each of these is a separate reason, and they are not
           interchangeable: "no wallet linked" is the person's doing, "could not
           read the chain" is ours, and "no token" is neither. Collapsing them
           into one grey zero is what made the numbers impossible to debug. */
        var reasons = {
          token_not_launched: "no address saved yet",
          no_wallet: "no wallet linked on this browser",
          read_failed: "the chain did not answer balanceOf — wrong address, or no RPC"
        };
        /* Labelled as this browser's player, not as the project. Slots belong
           to whoever is holding the token in the account this browser is signed
           into; on an admin's machine that is usually nobody, and "no wallet
           linked" here is normal rather than a fault to fix. */
        rows.push(["Slots for this browser's player", h.reason ? '<span class="no">' + esc(reasons[h.reason] || h.reason) + "</span>"
                                          : "<b>" + esc(h.buildings != null ? h.buildings : "—") + "</b>"]);
        // Not promoted to the hint: an admin with no wallet linked is the
        // normal case, and repeating it as advice makes it look like a problem.
      })
      .catch(function () { /* the rows already gathered are still worth showing */ })
      .then(function () {
        $("status").innerHTML = rows.map(function (r) {
          if (r[0] === "__addr") return '<div class="addr">' + r[1] + "</div>";
          return "<dt>" + r[0] + "</dt><dd>" + r[1] + "</dd>";
        }).join("");
        $("hint").textContent = hint;
      });
  }

  function post(body) {
    var token = $("token").value.trim();
    if (!token) { say("The admin token is empty.", "bad"); return; }
    say("Saving…");
    $("save").disabled = $("clear").disabled = true;
    fetch("/api/v1/admin/chain", {
      method: "POST",
      credentials: "same-origin",
      headers: { "content-type": "application/json", "x-loothood-admin": token },
      body: JSON.stringify(body)
    })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (res) {
        if (!res.ok) throw new Error(res.d && res.d.message || "refused");
        say("Saved. The site sees it immediately — no redeploy.", "good");
        $("addr").value = "";
        return refresh();
      })
      .catch(function (e) { say(String(e.message || e), "bad"); })
      .then(function () { $("save").disabled = $("clear").disabled = false; });
  }

  $("save").addEventListener("click", function () {
    var a = $("addr").value.trim();
    // Checked here as well as on the server, because a typo caught before the
    // request is a typo the person can still see in the field.
    if (!/^0x[0-9a-fA-F]{40}$/.test(a)) {
      say("That is not an address: 0x followed by exactly 40 hex characters (this has " + a.length + ").", "bad");
      return;
    }
    post({ tokenAddress: a });
  });

  $("clear").addEventListener("click", function () { post({ clearToken: true }); });

  /* WHEN THE CURRENT ADDRESS WAS SET, if the admin token is to hand.
   *
   * Added because the question came up and could not be answered: an address
   * was sitting in the field that nobody remembered putting there, and "which
   * of us typed this" is unanswerable while the only thing on screen is the
   * value. The date is stored — app_settings has updated_at — it simply was
   * never shown.
   *
   * Behind the admin token because it comes from the admin route. Silent when
   * the field is empty: this is an extra, not a requirement. */
  function when() {
    var token = $("token").value.trim();
    if (!token) return;
    fetch("/api/v1/admin/chain", {
      credentials: "same-origin",
      headers: { "x-loothood-admin": token }
    })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (!d || !d.token || !d.token.updatedAt) return;
        var el = document.createElement("dt");
        el.textContent = "Set on";
        var v = document.createElement("dd");
        v.textContent = new Date(d.token.updatedAt).toISOString().replace("T", " ").slice(0, 16) + " UTC";
        $("status").appendChild(el);
        $("status").appendChild(v);
      })
      .catch(function () { /* an extra that failed is not worth a message */ });
  }
  $("token").addEventListener("change", function () { refresh().then(when); });
  $("refresh").addEventListener("click", function () { refresh().then(when); });
  refresh();
})();
</script>
